<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IPv4 Subnet Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>IPv4 Subnet Calculator</h1>
      <p>Day 2: validate IPv4 CIDR input. Subnet calculations come later.</p>

      <form id="cidr-form">
        <label for="cidr-input">IPv4 address and CIDR prefix</label>
        <input
          id="cidr-input"
          name="cidr"
          type="text"
          placeholder="192.168.1.42/24"
          autocomplete="off"
          spellcheck="false"
        >
        <button type="submit">Calculate</button>
      </form>

      <p id="result" aria-live="polite"></p>
    </main>
  </body>
</html>
